<div id="s" class="scr dim"><button class="closeX" id="cfgClose" aria-label="Fechar configurações">×</button><h2>Configurações</h2><div class="panel"><div class="panelTop" id="cfgTabs"><button class="sg on" data-tab="visual">Visual</button><button class="sg" data-tab="mundo">Mundo</button><button class="sg" data-tab="controles">Controles</button><button class="sg" data-tab="jogo">Jogo</button><button class="sg" data-tab="pc">PC</button></div><div id="sl" class="panelBody"></div></div></div>

<div id="mcLoader"><div class="box"><h1>MiniCraft — carregando</h1><div class="sub" id="mcLoadSummary">Preparando o jogo...</div><div class="bar"><div class="mcLoadBar" id="mcLoadBar"></div></div><div id="mcLoadList"></div><button id="mcLoadRetry" onclick="location.reload()">Tentar novamente</button></div></div><script>
(function(){
  const state={items:[],failed:false,done:false};
  function el(id){return document.getElementById(id)}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  window.MCLoad={
    add:function(title,status,detail){
      let item=state.items.find(x=>x.title===title);
      if(item){item.status=status;item.detail=detail||item.detail||''}
      else {item={title,status,detail:detail||''};state.items.push(item)}
      const list=el('mcLoadList'); if(!list)return;
      list.innerHTML=state.items.map(x=>'<div class="mcLoadItem '+x.status+'"><div class="mcLoadTitle">'+(x.status==='ok'?'✓':x.status==='warn'?'⚠':'✕')+' '+esc(x.title)+'</div><div class="mcLoadDetail">'+esc(x.detail)+'</div></div>').join('');
      const fails=state.items.filter(x=>x.status==='fail').length;
      const warns=state.items.filter(x=>x.status==='warn').length;
      state.failed=fails>0;
      el('mcLoadSummary').textContent=fails?'O MiniCraft encontrou um erro durante a inicialização.':warns?'O MiniCraft iniciou com algumas correções de segurança.':'Verificando os componentes do jogo...';
      const n=Math.min(100,state.items.length*14+(state.done?20:0)); el('mcLoadBar').style.width=n+'%';
      el('mcLoader').classList.toggle('fail',state.failed);
    },
    done:function(){
      if(state.failed)return;
      state.done=true; this.add('Inicialização','ok','MiniCraft pronto.');
      setTimeout(()=>{const x=el('mcLoader');if(x)x.style.display='none'},180);
    },
    fatal:function(title,detail){this.add(title,'fail',detail);}
  };
  window.addEventListener('error',function(e){
    const d=(e.error&&e.error.stack)?e.error.stack:(e.message+'\n'+(e.filename||'')+':'+(e.lineno||'?')+':'+(e.colno||'?'));
    MCLoad.fatal('Erro JavaScript',d);
  });
  window.addEventListener('unhandledrejection',function(e){
    const r=e.reason; MCLoad.fatal('Erro assíncrono',r&&r.stack?r.stack:String(r));
  });
  setTimeout(function(){
    if(!window.__mcMainStarted){MCLoad.fatal('Inicialização','O código principal não terminou de iniciar.');}
  },12000);
  MCLoad.add('Página HTML','ok','MiniCraft 9.90 Preview 6.');
  try{
    const c=document.createElement('canvas');
    const gl=c.getContext('webgl',{antialias:false})||c.getContext('experimental-webgl');
    MCLoad.add('WebGL',gl?'ok':'fail',gl?'Contexto WebGL disponível.':'O dispositivo não disponibilizou WebGL.');
  }catch(e){MCLoad.fatal('WebGL','Não foi possível testar o suporte gráfico: '+(e&&e.message?e.message:String(e)))}
})();
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function drawCfg(){const c=$('#sl');c.innerHTML='';const list=OPT[cfgTab]||[];if(cfgTab==='pc'){drawPCSettings(c);return}if(!list.length){c.innerHTML='<div class="settingCard"><div class="settingTitle">Jogo</div><div>As configurações de jogabilidade desta versão permanecem nos controles durante a partida.</div></div>';return}list.forEach(([k,n,v])=>{const d=document.createElement('div');d.className='settingCard';if(k==='rd'||k==='fd'){d.innerHTML='<div class="settingTitle">'+n+'</div>';const r=document.createElement('div');r.className='rangeBox';const inp=document.createElement('input');inp.type='range';inp.min=2;inp.max=64;inp.step=1;inp.value=cfg[k];const val=document.createElement('span');val.className='rangeVal';val.textContent=cfg[k]+' chunks';const apply=()=>{cfg[k]=+inp.value;val.textContent=cfg[k]+' chunks';applyUI();try{localStorage.setItem('mc_cfg',JSON.stringify(cfg))}catch(e){}if(R)resize();if(k==='rd'){lastC='';stream();if(stars)stars.scale.setScalar(Math.max(1,(cfg.rd*16+20)/68));for(let i=0;i<Math.min(8,cq.length);i++)proc()}};inp.oninput=()=>val.textContent=inp.value+' chunks';inp.onchange=apply;r.append(inp,val);d.append(r);c.append(d);return}d.innerHTML='<div class="settingTitle">'+n+'</div>';const r=document.createElement('div');r.className='r3';v.forEach(([val,l])=>{const b=document.createElement('button');b.textContent=l;b.className='sg'+(cfg[k]==val?' on':'');b.onclick=()=>{cfg[k]=val;applyUI();try{localStorage.setItem('mc_cfg',JSON.stringify(cfg))}catch(e){}drawCfg()};r.append(b)});d.append(r);c.append(d)})}
$$('#cfgTabs .sg').forEach(b=>b.onclick=()=>{cfgTab=b.dataset.tab;$$('#cfgTabs .sg').forEach(x=>x.classList.toggle('on',x===b));drawCfg()});
function drawW(){const l=$('#wl');l.innerHTML=worlds.length?'':'<div style="text-align:center;text-shadow:2px 2px 0 #0006">Nenhum mundo ainda</div>';
 worlds.forEach((w,i)=>{const d=document.createElement('div');d.className='wi';d.innerHTML=`<div class="wn"><b>${w.name}</b><small>Seed ${w.seed}</small></div><button class="b2 g">▶</button><button class="b2">🗑</button>`;
  const[bp,bx]=d.querySelectorAll('button');bp.onclick=()=>start(w);
  bx.onclick=()=>{if(bx.dataset.s){worlds.splice(i,1);saveW();drawW()}else{bx.dataset.s=1;bx.textContent='Apagar?'}};l.append(d)})}
function nextWorldNumber(){return worlds.reduce((m,w)=>Math.max(m,w.n||0),0)+1}
function openNewWorld(){const n=nextWorldNumber();$('#wni').value='Mundo '+n;$('#wsi').value=(Math.random()*1000000000|0);show('nwc');setTimeout(()=>$('#wni').focus(),0)}
function createWorld(){const n=nextWorldNumber();let name=$('#wni').value.trim()||('Mundo '+n),seed=Number($('#wsi').value);if(!Number.isFinite(seed))seed=Math.random()*1000000000|0;seed=Math.trunc(seed);const w={n,name,seed};worlds.push(w);saveW();start(w)}
function setHow(tab){const mobile=tab==='mobile';$('#htm').classList.toggle('on',mobile);$('#hpc').classList.toggle('on',!mobile);$('#htxt').innerHTML=mobile?'<div class="helpbox"><b>Celular</b><br><br>• Use o joystick para andar.<br>• Arraste o lado direito para olhar.<br>• Toque para quebrar um bloco.<br>• Segure para colocar o bloco selecionado.<br>• ▲ pula. Toque duas vezes nele para ligar/desligar o voo.<br>• Use ☰ para pausar e salvar.</div>':'<div class="helpbox"><b>Computador</b><br><br>• WASD: andar.<br>• Mouse: olhar ao redor.<br>• Espaço: pular.<br>• Shift esquerdo: descer durante o voo.<br>• Clique esquerdo: quebrar.<br>• Clique direito: colocar.<br>• Roda do mouse ou 1–9: escolher slot.<br>• E: inventário; Esc: pausar/soltar o mouse.<br>• Os atalhos podem ser configurados em Configurações → PC.</div>';}
renderInventory();drawCfg();$('#play').onclick=()=>{drawW();show('w')};$('#how').onclick=()=>{setHow('mobile');show('h')};$('#cfg').onclick=()=>{drawCfg();show('s')};$('#nw').onclick=openNewWorld;$('#nw2').onclick=openNewWorld;$('#createw').onclick=createWorld;$('#htm').onclick=()=>setHow('mobile');$('#hpc').onclick=()=>setHow('pc');setHow('mobile');

  start({n:0,name:'Menu',seed:20260930,e:[],p:[8.5,40,8.5,0,0],t:.45});
  menuPreview=true;show('m');

}catch(e){MCLoad.fatal('Falha ao iniciar o MiniCraft',e&&e.stack?e.stack:String(e))}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
